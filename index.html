<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>PONG GAME</h1>
        
        <div class="controls">
            <button id="easyBtn" class="difficulty-btn">EASY</button>
            <button id="mediumBtn" class="difficulty-btn active">MEDIUM</button>
            <button id="hardBtn" class="difficulty-btn">HARD</button>
            <button id="pauseBtn" class="pause-btn">PAUSE</button>
        </div>

        <div class="scoreboard">
            <div class="score">
                <h2>Player</h2>
                <p id="playerScore">0</p>
            </div>
            <div class="difficulty-display" id="difficultyDisplay">MEDIUM</div>
            <div class="score">
                <h2>Computer</h2>
                <p id="computerScore">0</p>
            </div>
        </div>
        
        <canvas id="pongCanvas" width="800" height="400"></canvas>
        
        <div id="pauseOverlay" class="pause-overlay">
            <div class="pause-message">PAUSED</div>
            <p>Click RESUME or Press SPACE to continue</p>
        </div>

        <div class="instructions">
            <p><strong>Controls:</strong> Move mouse up/down or use Arrow Keys (↑/↓)</p>
            <p><strong>Goal:</strong> Bounce the ball past the computer to score!</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
